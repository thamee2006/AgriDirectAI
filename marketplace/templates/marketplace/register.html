{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - AgriDirect AI</title>

    <link rel="stylesheet"
          href="{% static 'marketplace/style.css' %}">

</head>

<body>

<nav>

    <div class="logo">
        🌾 AgriDirect AI
    </div>

    <div>
        <a href="/">Home</a>
        <a href="/login/">Login</a>
    </div>

</nav>


<section class="features">

    <div class="card"
         style="max-width:450px; margin:40px auto;">

        <div class="icon">🌾</div>

        <h2>Create Account</h2>

        <p>
            Join AgriDirect AI as a Farmer or Buyer.
        </p>


        {% if error %}

        <p style="color:red;">
            ❌ {{ error }}
        </p>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
                style="width:100%; margin:10px 0;"
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password"
                required
                style="width:100%; margin:10px 0;"
            >


            <select
                name="role"
                required
                style="width:100%; margin:10px 0;"
            >

                <option value="">
                    Select Role
                </option>

                <option value="farmer">
                    👨‍🌾 Farmer
                </option>

                <option value="buyer">
                    🛒 Buyer
                </option>

            </select>


            <button
                type="submit"
                class="btn primary"
            >
                🌱 Create Account
            </button>

        </form>


        <p style="margin-top:20px;">

            Already have an account?

            <a href="/login/">
                Login
            </a>

        </p>

    </div>

</section>

</body>

</html>
